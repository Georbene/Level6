<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager - FIFO Queue</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <style>
        body {
            background: #fdf6f0;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 850px;
        }
        .card {
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
            border-radius: 12px;
        }
        .job-item {
            transition: all 0.3s ease;
            border-left: 4px solid #f97316;
        }
        .job-item:hover {
            transform: translateX(5px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .badge-job-type {
            font-size: 0.75rem;
            padding: 0.35rem 0.65rem;
        }
        .processing {
            animation: blink 1.5s ease-in-out infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .empty-state {
            color: #6c757d;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container mt-4">
        <div class="card mb-4">
            <div class="card-header bg-warning text-white">
                <h2 class="mb-0">🗂️ Task Manager (FIFO Queue)</h2>
                <small>First In, First Out Scheduling</small>
            </div>
            <div class="card-body">
                <!-- Add Job Form -->
                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <input type="text" id="jobTitle" class="form-control" placeholder="Enter job name (e.g., Backup Files)">
                    </div>
                    <div class="col-md-4">
                        <select id="jobCategory" class="form-select">
                            <option value="email">📧 Email</option>
                            <option value="upload">📤 Upload</option>
                            <option value="message">💬 Message</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <button onclick="enqueueJob()" class="btn btn-success w-100">➕ Add</button>
                    </div>
                </div>

                <!-- Queue Stats -->
                <div class="row mb-3">
                    <div class="col-md-4">
                        <div class="card bg-light">
                            <div class="card-body text-center">
                                <h6 class="text-muted mb-1">Total Jobs</h6>
                                <h3 id="jobCount" class="mb-0">0</h3>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card bg-primary text-white">
                            <div class="card-body text-center">
                                <h6 class="mb-1">Next Job</h6>
                                <small id="upNext" class="d-block">None</small>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card bg-info text-white">
                            <div class="card-body text-center">
                                <h6 class="mb-1">Last Job</h6>
                                <small id="recentJob" class="d-block">None</small>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="d-flex gap-2 mb-3">
                    <button onclick="processJob()" class="btn btn-primary flex-fill">⚙️ Process Next</button>
                    <button onclick="showQueue()" class="btn btn-info flex-fill">👁️ View Queue</button>
                    <button onclick="clearJobQueue()" class="btn btn-danger">🗑️ Clear All</button>
                </div>

                <!-- Queue Display -->
                <div class="card">
                    <div class="card-header bg-secondary text-white"><strong>Queue Status</strong></div>
                    <div class="card-body" id="queueDisplay">
                        <p class="empty-state text-center mb-0">No jobs in queue yet.</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Processing Log -->
        <div class="card">
            <div class="card-header bg-success text-white"><strong>✅ Processed Jobs Log</strong></div>
            <div class="card-body" id="logDisplay" style="max-height: 300px; overflow-y: auto;">
                <p class="empty-state text-center mb-0">No jobs processed yet.</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
